{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Trekker Registration</h3>
                
                <form method="POST" action="{{ url_for('auth.register_user') }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <p class="mb-0 text-muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
