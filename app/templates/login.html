{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Account Login</h3>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <p class="mb-1 text-muted">New Trekker? <a href="{{ url_for('auth.register_user') }}">Create an Account</a></p>
                    <p class="mb-0 text-muted">Staff Member? <a href="{{ url_for('auth.register_staff') }}">Register as Staff</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
